<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2><b>Book an Appointment</b></h2>
        <div id="doctor-info"></div>

        <form id="appointmentForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="email" id="email" placeholder="Email ID" required>
            <input type="date" id="dob" required>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <select id="day" required>
                <option value="">Select Day</option>
                <option value="Mon">Mon</option>
                <option value="Tue">Tue</option>
                <option value="Wed">Wed</option>
                <option value="Thur">Thur</option>
                <option value="Fri">Fri</option>
                <option value="Sat">Sat</option>
                <option value="Sun">Sun</option>
            </select>
            <select id="slot" required>
                <option value="">Select Slot</option>
                <option value="Morning">Morning</option>
                <option value="Evening">Evening</option>
            </select>
            <button type="button" class="btn" onclick="showPaymentSection()">BOOK APPOINTMENT</button>
        </form>

        <button class="back-btn" onclick="goBack()">⬅ Back</button>

        <div id="paymentSection" class="hidden">
            <h3>Scan QR Code to Pay</h3>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=Payment+Successful" alt="Fake QR Code">
            <button class="btn pay-btn" onclick="processPayment()">PAY NOW</button>
        </div>

        <div id="confirmationMessage" class="hidden">
            <p class="success">✅ Payment Successful!</p>
            <p>📅 Appointment booked successfully.</p>
            <p>📩 Booking details have been emailed to you.</p>
            <p>📞 You will receive a confirmation call soon.</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
