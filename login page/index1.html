<!-- login/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - MEDICURE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h1>Login to MEDICURE</h1>
        <input type="text" id="username" placeholder="Username .  .  ." required>
        
        <div class="password-wrapper">
            <input type="password" id="password" placeholder="Password .  .  ." required>
            <span id="togglePassword" class="toggle-password">👁️</span>
        </div>
        
        <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember me
        </label>
        
        <button onclick="login()">Login</button>
        <p class="toggle-section">Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
    </div>

    <div class="login-container" id="signupContainer" style="display: none;">
        <h1>Create Account for MEDICURE </h1>
        <input type="text" id="newUsername" placeholder="Type username . . ." required>
        <input type="password" id="newPassword" placeholder="Type password .  .  ." required>
        <button onclick="signup()">Sign Up</button>
        <p class="toggle-section">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
    </div>

    <script src="./script.js"></script>
</body>
</html>
